<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinnanico | Links</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050308;
      --card-bg: rgba(6, 2, 12, 0.92);
      --accent-pink: #ff84c7;
      --accent-pink-strong: #ff4faa;
      --text-main: #fef7ff;
      --text-muted: #b3a4c7;
      --border-soft: rgba(255, 255, 255, 0.12);
      --radius-lg: 24px;
      --radius-pill: 999px;
      --shadow-heavy: 0 18px 40px rgba(0, 0, 0, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Silkscreen", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(135deg, rgba(0, 0, 0, 0.75), rgba(10, 0, 25, 0.75)),
        url("cinnanico-background-gif.gif");
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-y: auto;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background:
        radial-gradient(circle at top, rgba(255, 136, 210, 0.10), transparent 65%),
        var(--card-bg);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 18px 32px rgba(0, 0, 0, 0.85);
      padding: 28px 20px 22px;
      position: relative;
      backdrop-filter: blur(14px) brightness(0.92);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -50%;
      background-image:
        radial-gradient(circle at 10% 0%, rgba(0, 0, 0, 0.418), transparent 60%),
        radial-gradient(circle at 90% 100%, rgba(255, 20, 147, 0.12), transparent 55%);
      mix-blend-mode: screen;
      opacity: 0.55;
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 1;
    }

    /* PROFILE HEADER */
    .profile-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .pfp-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      padding: 3px;
      margin: 0 auto 12px;
      background:
        radial-gradient(circle at 0 0, #ffb6e1, transparent 55%),
        radial-gradient(circle at 100% 100%, #ff51c5, transparent 55%);
      box-shadow:
        0 0 20px rgba(255, 182, 193, 0.9),
        0 0 40px rgba(173, 216, 230, 0.65);
      animation: pfpGlow 2.5s infinite alternate;
    }

    .pfp-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #07020f;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pfp-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      filter: saturate(1.1);
    }

    @keyframes pfpGlow {
      0% {
        box-shadow:
          0 0 18px rgba(255, 182, 193, 0.75),
          0 0 32px rgba(173, 216, 230, 0.55);
      }
      50% {
        box-shadow:
          0 0 26px rgba(255, 182, 193, 0.95),
          0 0 46px rgba(173, 216, 230, 0.75);
      }
      100% {
        box-shadow:
          0 0 22px rgba(255, 182, 193, 0.85),
          0 0 38px rgba(173, 216, 230, 0.65);
      }
    }

    .creator-name {
      font-family: "Silkscreen", cursive;
      font-size: 1.9rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 6px rgba(255, 182, 193, 0.8);
      margin-bottom: 4px;
    }

    .creator-sub {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-indent: 0.18em;
      color: var(--text-muted);
    }

    .divider {
      width: 70px;
      height: 1px;
      margin: 18px auto 14px;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.45), transparent);
    }

    /* SOCIAL ICONS ROW*/
    .social-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .social-row a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: radial-gradient(circle at 0 0, rgba(255, 255, 255, 0.16), transparent 60%),
                  rgba(255, 255, 255, 0.02);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.75);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .social-row a img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      filter: brightness(0.95) contrast(1.1);
      pointer-events: none;
    }

    .social-row a:hover {
      transform: translateY(-2px) scale(1.05);
      border-color: var(--accent-pink-strong);
      box-shadow: 0 10px 26px rgba(255, 20, 147, 0.8);
    }

    .cta-text {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 12px;
      text-align: center;
      animation: bounceArrow 1.2s infinite, glowPulse 2s infinite alternate;
      text-shadow:
        0 0 2px #ffb6c1,
        0 0 4px #add8e6;
    }

    @keyframes bounceArrow {
      0%, 20%, 50%, 80%, 100%   { transform: translateY(0); }
      40%                       { transform: translateY(-4px); }
      60%                       { transform: translateY(-2px); }
    }

    @keyframes glowPulse {
      0% {
        text-shadow:
          0 0 1.5px #ffb6c1,
          0 0 3px   #add8e6;
      }
      50% {
        text-shadow:
          0 0 2.5px #ffb6c1,
          0 0 4px   #add8e6;
      }
      100% {
        text-shadow:
          0 0 2px   #ffb6c1,
          0 0 3.5px #add8e6;
      }
    }

    /* MAIN BIG BUTTON  */
    .main-link {
      display: block;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
      box-shadow:
        0 0 24px rgba(255, 182, 193, 0.85),
        0 0 44px rgba(173, 216, 230, 0.65);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .main-link img {
      width: 100%;
      height: 190px;
      display: block;
      object-fit: cover;
      object-position: 50% 55%;
      filter: brightness(0.85) contrast(1.05);
    }

    .main-link-label {
      position: absolute;
      inset-inline: 0;
      bottom: 0;
      padding: 10px 8px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
      text-align: center;
      font-family: "Silkscreen", cursive;
      font-size: 1rem;
      color: #fff;
      text-shadow:
        0 0 6px rgba(255, 182, 193, 0.85),
        0 0 12px rgba(173, 216, 230, 0.75);
    }

    .main-link:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 0 30px rgba(255, 182, 193, 0.95),
        0 0 52px rgba(173, 216, 230, 0.8);
      filter: brightness(1.02);
    }

    footer {
      margin-top: 16px;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 22px 12px;
      }
      .card {
        padding: 24px 18px 20px;
      }
      .creator-name {
        font-size: 1.7rem;
      }
      .main-link img {
        height: 170px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="card-inner">

      <!-- PROFILE HEADER -->
      <header class="profile-header">
        <div class="pfp-ring">
          <div class="pfp-inner">
            <img src="cinnanico-pfp.jpg" alt="Creator profile picture">
          </div>
        </div>

        <h1 class="creator-name">Nicky Nakamura</h1>

        <div class="divider"></div>
      </header>

      <!-- SOCIAL ICON ROW -->
      <section class="social-row">
        <a href="https://instagram.com/cinnanico" target="_blank">
          <img src="instagram-logo.png" alt="Instagram">
        </a>
        <a href="https://www.tiktok.com/@cinnanakoss" target="_blank">
          <img src="tiktok-logo.png" alt="TikTok">
        </a>
        <a href="https://x.com/cinnanico" target="_blank">
          <img src="X-logo.png" alt="X">
        </a>
        <a href="https://twitch.tv/cinnanicos" target="_blank">
          <img src="twitch-logo.png" alt="Twitch">
        </a>
        <a href="https://throne.com/cinnanico" target="_blank">
          <img src="throne-logo.png" alt="Throne">
        </a>
      </section>

      <div class="cta-text">
        come hang out with me ↓
      </div>

      <!-- MAIN BIG BUTTON -->
      <a href="https://onlyfans.com/cinnanicos" target="_blank" class="main-link">
        <img src="cinnanico-main-banner.jpg" alt="Exclusive content">
        <div class="main-link-label">
          💗 MY EXCLUSIVE CONTENT 💗
        </div>
      </a>

      <footer>© 2025 CINNANICO</footer>

    </div>
  </main>
</body>
</html>
